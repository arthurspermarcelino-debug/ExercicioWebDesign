<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Cadastro de Usuário</h2>

    <form>

        <!-- Nome -->
        <label>Nome completo:</label><br>
        <input type="text" name="nome" required><br><br>

        <!-- Email -->
        <label>email:</label><br>
        <input type="email" name="email" required><br><br>

        <!-- Senha -->
        <label>Senha:</label><br>
        <input type="password" name="senha" required><br><br>

        <!-- Confirmar senha -->
        <label>Confirmar senha:</label><br>
        <input type="password" name="confirmar_senha" required><br><br>

        <!-- Data de nascimento -->
        <label>Data de nascimento:</label><br>
        <input type="date" name="data_nascimento"><br><br>

        <!-- Gênero -->
        <label>Gênero:</label><br>
        <input type="radio" name="genero"> Feminino<br>
        <input type="radio" name="genero"> Masculino<br>
        <input type="radio" name="genero"> Outro<br><br>

        <!-- Interesses -->
        <label>Interesses:</label><br>
        <input type="checkbox" name="interesse"> Tecnologia<br>
        <input type="checkbox" name="interesse"> Esportes<br>
        <input type="checkbox" name="interesse"> Música<br><br>

        <!-- País -->
        <label>País:</label><br>
        <select name="pais">
            <option>Brasil</option>
            <option>Portugal</option>
            <option>Argentina</option>
            <option>Outro</option>
        </select><br><br>

        <!-- Termos -->
        <input type="checkbox" required> Eu aceito os termos de uso<br><br>

        <!-- Botão -->
        <button type="submit">Criar Conta</button>

        <!-- ESQUECI MINHA SENHA -->
        <p><a href="esqueciaenha.html">Esqueci minha senha</a></p>
        
    </form>
</body>

</html>
